name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows running it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a new push waits for the running deployment to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from src/
        run: python3 build.py

      - name: Collect the files to publish
        # Only what the site needs: not src/, build.py, README.md, .github/...
        run: |
          mkdir _site
          cp -r index.html style.css app.js assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
