      <p class="tagline">A file system that <em>forgets</em> data.</p>
      <p class="lead">
        LazyFS keeps your writes in its own page cache and only persists what the application
        explicitly <code>fsync</code>s. Pull the plug whenever you want and find the
        data-loss bugs hiding in your database — <strong>no code changes needed</strong>.
